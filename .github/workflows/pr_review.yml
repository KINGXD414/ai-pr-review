name: AI PR Review (auto-comment)

# Trigger on every PR open / update.
# Will post (or update) a sticky comment on the PR with the AI review report.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# Need write access to comment on PRs.
permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: Generate AI review and post as PR comment
    runs-on: ubuntu-22.04
    # Skip draft PRs to save CI minutes (remove this if you want drafts too).
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout repo (target branch state)
        uses: actions/checkout@v4

      - name: Install build deps
        # Same dep set as release.yml — already validated to build on
        # ubuntu-22.04 runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libcurl4-openssl-dev libssl-dev libsqlite3-dev \
            libspdlog-dev libfmt-dev nlohmann-json3-dev \
            libclang-14-dev clang-14 llvm-14-dev

      - name: Build ai-pr-review only
        # Skip eval / tests to save time. ~2-3 min on ubuntu-22.04.
        run: |
          cmake -B build -S code \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)" --target ai-pr-review
          ./build/ai-pr-review --version

      - name: Run AI review on this PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          PR_URL="https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          echo "Reviewing: $PR_URL"

          # Use --persona linus by default (highest score in v0.2.0 eval matrix:
          # +30% on spdlog-3594 high-difficulty case). Comment out and uncomment
          # one of the alternatives if you want a different review style.
          ./build/ai-pr-review \
            --pr "$PR_URL" \
            --github-token "$GITHUB_TOKEN" \
            --llm-key "$DEEPSEEK_API_KEY" \
            --output review.md \
            --persona linus
            # --self-critique      # alternative: two-pass with reflection
            # --consensus 3        # alternative: 3-way vote + meta-review

          echo "================ REVIEW PREVIEW ================"
          head -60 review.md
          echo "================================================"

      - name: Prepend bot header to review
        # Add a small banner so the PR comment is clearly marked as bot-generated
        # and not human review.
        run: |
          {
            echo "## 🤖 AI PR Review"
            echo ""
            echo "> Generated by [ai-pr-review](https://github.com/${{ github.repository }})"
            echo "> Config: \`--persona linus\` · Model: \`deepseek-chat\`"
            echo "> ⚠️ Auto-generated for reference only. Final judgment remains with human reviewers."
            echo ""
            echo "---"
            echo ""
            cat review.md
          } > review_with_header.md
          mv review_with_header.md review.md

      - name: Post review as sticky PR comment
        # Sticky comment: subsequent runs UPDATE the same comment instead of
        # spamming new ones. Identified by the `header:` field.
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ai-pr-review
          path: review.md

      - name: Upload review as workflow artifact
        # Keep raw review file as artifact for 30 days (debugging / archive).
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-review-pr-${{ github.event.pull_request.number }}
          path: review.md
          retention-days: 30
