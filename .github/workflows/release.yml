name: Release

# Triggered when you push a tag like v0.2.0 / v1.0.0
on:
  push:
    tags:
      - 'v*'
  # Allow manual trigger for dry-run testing
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write   # for creating GitHub Releases
  packages: write   # for pushing to ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: build Linux x86_64 binary, attach to GitHub Release as tar.gz
  # ---------------------------------------------------------------------------
  release-linux-binary:
    name: Linux x86_64 binary
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libcurl4-openssl-dev libssl-dev libsqlite3-dev \
            libspdlog-dev libfmt-dev nlohmann-json3-dev \
            libclang-14-dev clang-14 llvm-14-dev

      - name: Configure & build
        run: |
          cmake -B build -S code \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)" \
            --target ai-pr-review ai-pr-eval

      - name: Smoke test
        run: |
          ./build/ai-pr-review --version
          ./build/ai-pr-eval --help || true

      - name: Package tarball
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          PKG="ai-pr-review-${TAG}-linux-x64"
          mkdir -p "dist/${PKG}"
          cp build/ai-pr-review build/ai-pr-eval "dist/${PKG}/"
          cp README.md "dist/${PKG}/" 2>/dev/null || true
          cp LICENSE   "dist/${PKG}/" 2>/dev/null || true
          cd dist && tar czf "${PKG}.tar.gz" "${PKG}"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
          ls -lh

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256

  # ---------------------------------------------------------------------------
  # Job 2: build multi-arch Docker image and push to ghcr.io
  # ---------------------------------------------------------------------------
  release-docker-image:
    name: Docker image to ghcr.io
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lower-case owner
        id: lc
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # linux/arm64 disabled by default — libclang cross-compile is slow.
          # Re-enable by changing to:  linux/amd64,linux/arm64
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.lc.outputs.owner }}/ai-pr-review:${{ steps.tag.outputs.name }}
            ghcr.io/${{ steps.lc.outputs.owner }}/ai-pr-review:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

